<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles/app.css"><title>YouTube Playlist Bookmarks</title></head>
  <body class="popup">
    <main>
      <header><span class="mark">YT</span><div><h1>Playlist Bookmarks</h1><p id="destination">No destination folder selected</p></div><button id="settings" class="icon-button" aria-label="Open settings" title="Open settings">&#9881;</button></header>
      <section class="status"><span id="status-dot" class="dot"></span><div><strong id="status-title">Ready to sync</strong><p id="status-copy">Choose a bookmark folder to begin.</p></div></section>
      <section><div class="section-heading"><h2>Playlists</h2><span id="playlist-count"></span></div><ul id="playlists" class="playlist-list"></ul></section>
      <button id="sync" class="primary">Sync now</button>
      <p id="interval-note" class="note"></p>
    </main>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
